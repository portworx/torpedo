apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fio
spec:
  serviceName: fio
  {{ if .Replicas }}
  replicas: {{ .Replicas }}
  {{ else }}
  replicas: 2{{ end }}
  selector:
    matchLabels:
      app: fio
  template:
    metadata:
      labels:
        app: fio
    spec:
      containers:
      - name: fio
        image: portworx/fio_drv
        command: ["fio"]
        env:
          - name: MY_POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: LOG_FILE_PREFIX
            value: /logs/$(MY_POD_NAME)
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "1"
            memory: 500Mi
        args: ["/configs/fio.job", "--status-interval=1", "--eta=never", "--output=$(LOG_FILE_PREFIX)_fio.log"]
        volumeMounts:
        - name: fio-config-vol
          mountPath: /configs
        - name: fio-data
          mountPath: /scratch
        - name: fio-log
          mountPath: /logs
      volumes:
      - name: fio-config-vol
        configMap:
          name: fio-job-config
      - name: fio-log
        persistentVolumeClaim:
          claimName: fio-log-fb-pvc
  volumeClaimTemplates:
  - metadata:
      name: fio-data
    spec:
      storageClassName: fio-fa-da-sc
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
        {{ if .VolumeSize }}
          storage: {{ .VolumeSize }}
        {{ else }}
          storage: 200Gi{{ end }}
