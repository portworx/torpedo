apiVersion: apps/v1
kind: Deployment
metadata:
  name: vdbench-fb-volume
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: vdbench-fb-volumes
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: vdbench-fb-volumes
    spec:
      containers:
      - args:
        - |
          while true; do
            dd if=/dev/urandom of=/tmp/pvc-fbda/file-$(date +%s).txt bs=1M count=1 &
            sleep 500;
          done
        command:
        - /bin/sh
        - -c
        image: portworx/vdbench:torpedo
        imagePullPolicy: IfNotPresent
        name: vdbench
        resources:
          limits:
            cpu: "1"
            memory: 500Mi
          requests:
            cpu: 100m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp/pvc-fbda
          name: pvc-fbda
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      volumes:
      - name: pvc-fbda
        persistentVolumeClaim:
          claimName: pvc-fbda
