apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sc-sharedv4svc-repl-1
parameters:
  repl: "1"
  sharedv4: "true"
  sharedv4_mount_options: vers=3.0,nolock
provisioner: pxd.portworx.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
