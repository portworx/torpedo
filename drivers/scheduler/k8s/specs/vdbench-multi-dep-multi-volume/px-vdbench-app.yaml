apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ if .DeploymentCount }}vdbench-multi-volumes-{{ .DeploymentCount }}{{ else }}vdbench-multi-volumes{{ end }}
  labels:
    app: {{ if .DeploymentCount }}vdbench-multi-volumes-{{ .DeploymentCount }}{{ else }}vdbench-multi-volumes{{ end }}
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{ if .DeploymentCount }}vdbench-multi-volumes-{{ .DeploymentCount }}{{ else }}vdbench-multi-volumes{{ end }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: {{ if .DeploymentCount }}vdbench-multi-volumes-{{ .DeploymentCount }}{{ else }}vdbench-multi-volumes{{ end }}
    spec:
      containers:
          - name: vdbench
            image: portworx/vdbench:torpedo
            imagePullPolicy: IfNotPresent
            resources:
              limits:
                cpu: 1000m
                memory: 500Mi
              requests:
                cpu: 100m
                memory: 256Mi
            command: ["/bin/sh", "-c"]
            args:
              - |
                {{ if .PvcEnd }}
                {{- range $val := Loop .PvcStart .PvcEnd }}
                dd if=/dev/urandom of=/tmp/vdbench-pvc-{{ $val }}/vfile-$(date +%s).txt bs=1M count=46080 &
                {{- end }}
                {{ else }}
                dd if=/dev/urandom of=/tmp/vdbench-pvc/vfile-$(date +%s).txt bs=1M count=9216 &
                {{- end }}
                while true; do
                  {{ if .PvcEnd }}
                  rm -f /tmp/vdbench-pvc-1/* &
                  dd if=/dev/urandom of=/tmp/vdbench-pvc-1/vfile-$(date +%s).txt bs=1M count=46080 &
                  {{- end }}
                  sleep 800
                done
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
            volumeMounts:
        {{ if .PvcEnd }}
        {{- range $val := Loop .PvcStart .PvcEnd }}
            - mountPath: /tmp/vdbench-pvc-{{ $val }}
              name: vdbench-pvc-{{ $val }}
        {{- end }}
        {{ else }}
            - mountPath: /tmp/vdbench-pvc
              name: vdbench-pvc
        {{- end }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      volumes:
      {{ if .PvcEnd }}
      {{- range $val := Loop .PvcStart .PvcEnd }}
      - name: vdbench-pvc-{{ $val }}
        persistentVolumeClaim:
          claimName: vdbench-pvc-{{ $val }}
      {{- end }}
      {{ else }}
      - name: vdbench-pvc
        persistentVolumeClaim:
          claimName: vdbench-pvc
      {{- end }}

