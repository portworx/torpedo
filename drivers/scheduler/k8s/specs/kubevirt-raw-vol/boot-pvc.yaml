apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: raw-vol-immediate
parameters:
  repl: "3"
  sharedv4: "true"
  sharedv4_mount_options: vers=3.0,nolock
provisioner: pxd.portworx.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fio-debian-template-pvc
  namespace: openshift-virtualization-os-images
  labels:
    app: containerized-data-importer
  annotations:
    cdi.kubevirt.io/storage.import.endpoint: http://kubevirt-disk-registry.pwx.dev.purestorage.com/more_images/fio-rw-load-perf-long.qcow2
    pvc.source: "cloned"
spec:
  storageClassName: raw-vol-immediate
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
