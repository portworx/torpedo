apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: disk-fill-vm-storageclass
parameters:
  repl: "2"
  sharedv4: "true"
  sharedv4_mount_options: vers=3.0,nolock
provisioner: pxd.portworx.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-fill-vm-disk-high-resource
  namespace: openshift-virtualization-os-images
  labels:
    app: containerized-data-importer
  annotations:
    cdi.kubevirt.io/storage.import.endpoint: http://kubevirt-disk-registry.pwx.dev.purestorage.com/more_images/fill-vm-data-disk.qcow2
    pvc.source: "cloned"
spec:
  storageClassName: disk-fill-vm-storageclass
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi