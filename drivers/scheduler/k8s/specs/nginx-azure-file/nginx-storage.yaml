##### Persistent volume claim
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: nginx-pvc-legacy-shared
spec:
  storageClassName: nginx-sc
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: nginx-pvc-enc-legacy-shared
spec:
  storageClassName: nginx-sc
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
