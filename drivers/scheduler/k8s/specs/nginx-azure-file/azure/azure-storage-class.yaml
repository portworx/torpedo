##### Storage class for Azure File
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: nginx-sc
mountOptions:
  - mfsymlinks
  - actimeo=30
  - nosharesock
parameters:
  skuName: Standard_LRS
provisioner: file.csi.azure.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
